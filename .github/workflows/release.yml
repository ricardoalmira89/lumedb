name: Release

# Pushing a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`) builds LumeDB for every
# platform and publishes a GitHub Release with the packages attached.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build the release for
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  linux:
    name: Linux (.deb and .tar.gz)
    # The oldest supported runner, so the binary also runs on older glibc versions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev libgtk-3-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - name: Build
        run: cargo build --release --locked -p lumedb-app
      - name: Package
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p dist
          cargo deb -p lumedb-app --no-build --deb-version "$version" -o "dist/lumedb_${version}_amd64.deb"
          name="lumedb-${version}-linux-x86_64"
          mkdir -p "$name"
          cp target/release/lumedb assets/lumedb.desktop assets/lumedb.svg README.md LICENSE-MIT LICENSE-APACHE "$name/"
          tar -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*

  windows:
    name: Windows (.zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p lumedb-app
      - name: Package
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          $name = "lumedb-$version-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $name, dist | Out-Null
          Copy-Item target/release/lumedb.exe, README.md, LICENSE-MIT, LICENSE-APACHE $name
          Compress-Archive -Path $name -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*

  macos:
    name: macOS ${{ matrix.arch }} (.app)
    strategy:
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p lumedb-app --target ${{ matrix.target }}
      - name: Package
        run: |
          set -euo pipefail
          version="${TAG#v}"
          app="LumeDB.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "target/${{ matrix.target }}/release/lumedb" "$app/Contents/MacOS/lumedb"
          # Icon: every size macOS asks for, from the 512 px PNG.
          mkdir lumedb.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/lumedb-512.png --out "lumedb.iconset/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2))
            sips -z $d $d assets/lumedb-512.png --out "lumedb.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns lumedb.iconset -o "$app/Contents/Resources/lumedb.icns"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>LumeDB</string>
            <key>CFBundleDisplayName</key><string>LumeDB</string>
            <key>CFBundleIdentifier</key><string>io.github.ricardoalmira89.lumedb</string>
            <key>CFBundleExecutable</key><string>lumedb</string>
            <key>CFBundleIconFile</key><string>lumedb</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          # Ad-hoc signature: required to run on Apple Silicon (the app is not notarized).
          codesign --force --deep --sign - "$app"
          mkdir -p dist
          ditto -c -k --keepParent "$app" "dist/lumedb-${version}-macos-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos-${{ matrix.arch }}
          path: dist/*

  publish:
    name: Publish the release
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: LumeDB ${{ env.TAG }}
          # 0.x versions are alpha: marked as pre-release.
          prerelease: ${{ startsWith(env.TAG, 'v0.') }}
          generate_release_notes: true
          files: dist/*
          body: |
            ## Downloads

            | Platform | File |
            |---|---|
            | Windows 10/11 (x64) | `lumedb-*-windows-x86_64.zip` — unzip and run `lumedb.exe` |
            | macOS, Apple Silicon | `lumedb-*-macos-aarch64.zip` |
            | macOS, Intel | `lumedb-*-macos-x86_64.zip` |
            | Debian / Ubuntu | `lumedb_*_amd64.deb` — `sudo apt install ./lumedb_*_amd64.deb` |
            | Other Linux | `lumedb-*-linux-x86_64.tar.gz` |

            > **macOS:** the app is not notarized yet. The first time, right-click `LumeDB.app` → **Open**, or run
            > `xattr -dr com.apple.quarantine LumeDB.app`.
            >
            > **Windows:** SmartScreen may warn that the app is unrecognized; choose **More info → Run anyway**.

            Verify downloads with `SHA256SUMS`.
