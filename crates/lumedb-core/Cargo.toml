[package]
name = "lumedb-core"
version.workspace = true
edition.workspace = true
description = "Core of LumeDB: connections, drivers, metadata, DDL and data tools for MySQL, PostgreSQL and SQLite"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
postgres = "0.19"
mysql = { version = "25", default-features = false, features = ["minimal", "native-tls"] }
roxmltree = "0.20"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
blowfish = "0.9"
sha1 = "0.10"
hex = "0.4"
native-tls = "0.2"
postgres-native-tls = "0.5"
ssh2 = "0.9"
sqlformat = "0.2"
csv = "1"
rust_xlsxwriter = "0.79"
calamine = "0.26"
flate2 = "1"
chrono = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
ureq = { version = "2", features = ["json"] }

# macOS has no system OpenSSL: build it into the binary, so the app does not depend on Homebrew
# and the Intel build can be cross-compiled on Apple Silicon.
[target.'cfg(target_os = "macos")'.dependencies]
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
